[versions]
agp = "9.4.1"
kotlin = "2.2.10"
coreKtx = "1.17.0"
lifecycle = "2.9.4"
activityCompose = "1.12.4"
composeBom = "2026.09.00"
appcompat = "1.7.1"
datastore = "1.1.7"
playServicesLocation = "21.3.0"
coroutines = "1.10.2"
serializationJson = "1.9.0"
maplibre = "11.13.0"
junit = "4.13.2"
junitVersion = "1.1.5"
espressoCore = "3.5.1"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
